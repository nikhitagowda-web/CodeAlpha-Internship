<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlphaShop - E-Commerce Store</title>
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .product-img { hieght: 200px; object-fit: cover; }
  </style>
</head>
<body class="bg-light">

  <!-- Navbar Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold text-info" href="#">AlphaShop</a>
      <button class="btn btn-outline-info d-flex align-items-center gap-2" data-bs-toggle="offcanvas" data-bs-target="#cartOffcanvas">
        🛒 <span>Cart</span>
        <span class="badge bg-info text-dark rounded-pill" id="cartCount">0</span>
      </button>
    </div>
  </nav>

  <!-- Main Grid Platform -->
  <main class="container my-5">
    <h2 class="fw-bold text-secondary mb-4">Featured Products</h2>
    <div class="row g-4" id="productGrid">
      <!-- Dynamic JS generation inserts cards here -->
    </div>
  </main>

  <!-- Shopping Cart Sidebar (Offcanvas) -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="cartOffcanvas">
    <div class="offcanvas-header bg-dark text-white">
      <h5 class="offcanvas-title fw-bold">Your Basket</h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body d-flex flex-column justify-content-between">
      <div id="cartItemsList" class="list-group list-group-flush overflow-y-auto mb-3">
        <!-- Cart rows show up here -->
      </div>
      <div class="border-t pt-3">
        <div class="d-flex justify-content-between fw-bold fs-5 mb-3">
          <span>Total:</span>
          <span class="text-success" id="cartTotal">$0.00</span>
        </div>
        <button class="btn btn-info w-full py-2 fw-bold w-100" onclick="processOrder()">Checkout Now</button>
      </div>
    </div>
  </div>

  <!-- Product Details Modal Window -->
  <div class="modal fade" id="detailsModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="modalTitle">Product Title</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <img src="" id="modalImage" class="img-fluid rounded mb-3 w-100" alt="Product">
          <p class="text-muted" id="modalDesc">Detailed description here.</p>
          <h4 class="fw-bold text-dark" id="modalPrice">$0.00</h4>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-info text-dark fw-bold" id="modalAddBtn">Add To Cart</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS Bundle CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    const products = [
      { id: 1, name: "Wireless Studio Headphones", price: 129, desc: "Immersive sound profile with hybrid active noise canceling tech.", img: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500" },
      { id: 2, name: "Minimalist Chrono Watch", price: 199, desc: "Premium genuine leather bands featuring precision Japanese quartz movement.", img: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" },
      { id: 3, name: "Ergonomic Lumbar Chair", price: 249, desc: "High breathability configuration crafted for continuous comfort.", img: "https://images.unsplash.com/photo-1505797149-43b0069ec26b?w=500" }
    ];

    let cart = [];

    function renderStore() {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = products.map(p => `
        <div class="col-12 col-md-4">
          <div class="card h-100 shadow-sm border-0">
            <img src="${p.img}" class="card-img-top product-img" alt="${p.name}">
            <div class="card-body d-flex flex-column justify-content-between">
              <div>
                <h5 class="card-title fw-bold text-dark text-truncate" onclick="showDetails(${p.id})" style="cursor:pointer;">${p.name}</h5>
                <p class="card-text text-muted small text-truncate">${p.desc}</p>
              </div>
              <div class="d-flex justify-content-between align-items-center mt-3">
                <span class="fs-5 fw-bold text-dark">$${p.price}</span>
                <button class="btn btn-sm btn-dark px-3 rounded-pill" onclick="addToCart(${p.id})">Add</button>
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function showDetails(id) {
      const p = products.find(prod => prod.id === id);
      document.getElementById('modalTitle').innerText = p.name;
      document.getElementById('modalImage').src = p.img;
      document.getElementById('modalDesc').innerText = p.desc;
      document.getElementById('modalPrice').innerText = `$${p.price}`;
      document.getElementById('modalAddBtn').onclick = () => {
        addToCart(p.id);
        bootstrap.Modal.getInstance(document.getElementById('detailsModal')).hide();
      };
      new bootstrap.Modal(document.getElementById('detailsModal')).show();
    }

    function addToCart(id) {
      const item = products.find(p => p.id === id);
      const target = cart.find(c => c.id === id);
      if(target) target.qty++;
      else cart.push({ ...item, qty: 1 });
      updateCartUI();
    }

    function updateCartUI() {
      const list = document.getElementById('cartItemsList');
      document.getElementById('cartCount').innerText = cart.reduce((sum, i) => sum + i.qty, 0);
      
      if(cart.length === 0) {
        list.innerHTML = `<p class="text-muted text-center py-4">Your cart is empty.</p>`;
        document.getElementById('cartTotal').innerText = "$0.00";
        return;
      }

      list.innerHTML = cart.map(i => `
        <div class="list-group-item d-flex justify-content-between align-items-center border-0 px-0 py-2">
          <div>
            <h6 class="mb-0 fw-bold text-dark">${i.name}</h6>
            <small class="text-muted">$${i.price} x ${i.qty}</small>
          </div>
          <span class="fw-bold">$${i.price * i.qty}</span>
        </div>
      `).join('');

      const overallSum = cart.reduce((total, i) => total + (i.price * i.qty), 0);
      document.getElementById('cartTotal').innerText = `$${overallSum.toFixed(2)}`;
    }

    function processOrder() {
      if(cart.length === 0) return alert("Add items to your cart first!");
      alert("Order processed cleanly! Thank you for testing AlphaShop.");
      cart = [];
      updateCartUI();
      bootstrap.Offcanvas.getInstance(document.getElementById('cartOffcanvas')).hide();
    }

    renderStore();
    updateCartUI();
  </script>
</body>
</html>
