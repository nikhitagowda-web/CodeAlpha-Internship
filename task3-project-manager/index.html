<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AlphaBoard - Sprint Planner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-dark">

  <div class="container my-5">
    <!-- Header Input Form Panel -->
    <header class="d-flex flex-column flex-md-row justify-content-between align-items-md-center border-bottom pb-4 mb-4 gap-3">
      <div>
        <h2 class="fw-black text-dark mb-0">Project Workflow Engine</h2>
        <p class="text-muted small mb-0">Manage tasks seamlessly using clean state changes.</p>
      </div>
      
      <form class="d-flex gap-2 bg-white p-2 rounded-3 shadow-sm border" onsubmit="pushCard(event)">
        <input type="text" id="taskTitle" class="form-control form-control-sm border-0 bg-light" placeholder="New Task Title" required>
        <button type="submit" class="btn btn-sm btn-primary font-weight-bold px-3">Add</button>
      </form>
    </header>

    <!-- Column Board Grid -->
    <div class="row g-4">
      <!-- To Do Board Column -->
      <div class="col-12 col-md-4">
        <div class="bg-white rounded-3 p-3 shadow-sm border-top border-4 border-warning h-100">
          <h6 class="fw-bold text-uppercase tracking-wide text-secondary mb-3 d-flex justify-content-between">
            To Do <span class="badge bg-warning text-dark rounded-pill" id="count-todo">0</span>
          </h6>
          <div class="d-flex flex-column gap-2" id="col-todo"></div>
        </div>
      </div>

      <!-- In Progress Board Column -->
      <div class="col-12 col-md-4">
        <div class="bg-white rounded-3 p-3 shadow-sm border-top border-4 border-primary h-100">
          <h6 class="fw-bold text-uppercase tracking-wide text-secondary mb-3 d-flex justify-content-between">
            In Progress <span class="badge bg-primary rounded-pill" id="count-progress">0</span>
          </h6>
          <div class="d-flex flex-column gap-2" id="col-progress"></div>
        </div>
      </div>

      <!-- Completed Board Column -->
      <div class="col-12 col-md-4">
        <div class="bg-white rounded-3 p-3 shadow-sm border-top border-4 border-success h-100">
          <h6 class="fw-bold text-uppercase tracking-wide text-secondary mb-3 d-flex justify-content-between">
            Done <span class="badge bg-success rounded-pill" id="count-done">0</span>
          </h6>
          <div class="d-flex flex-column gap-2" id="col-done"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let tickets = [
      { id: 1, title: "Structure Navigation Links", status: "todo" },
      { id: 2, title: "Configure CSS Grid Media Layouts", status: "progress" }
    ];

    function synchronizeBoard() {
      const zones = { todo: 'col-todo', progress: 'col-progress', done: 'col-done' };
      const tallies = { todo: 'count-todo', progress: 'count-progress', done: 'count-done' };
      
      Object.keys(zones).forEach(key => {
        const DOMNode = document.getElementById(zones[key]);
        const subset = tickets.filter(t => t.status === key);
        
        document.getElementById(tallies[key]).innerText = subset.length;
        
        if(subset.length === 0) {
          DOMNode.innerHTML = `<div class="text-center py-4 text-muted border border-dashed rounded-3 small">Empty</div>`;
          return;
        }

        DOMNode.innerHTML = subset.map(t => `
          <div class="card shadow-sm border-light-subtle p-3 rounded-2 bg-light">
            <h6 class="fw-bold text-dark small mb-3">${t.title}</h6>
            <div class="d-flex justify-content-end gap-1">
              ${key !== 'todo' ? `<button onclick="shiftStatus(${t.id}, '${key === 'done' ? 'progress' : 'todo'}')" class="btn btn-xs btn-outline-secondary py-0 px-2 font-monospace">←</button>` : ''}
              ${key !== 'done' ? `<button onclick="shiftStatus(${t.id}, '${key === 'todo' ? 'progress' : 'done'}')" class="btn btn-xs btn-dark py-0 px-2 font-monospace">→</button>` : ''}
            </div>
          </div>
        `).join('');
      });
    }

    function pushCard(e) {
      e.preventDefault();
      const field = document.getElementById('taskTitle');
      tickets.push({ id: Date.now(), title: field.value, status: 'todo' });
      field.value = '';
      synchronizeBoard();
    }

    function shiftStatus(id, newStatus) {
      const match = tickets.find(t => t.id === id);
      if(match) match.status = newStatus;
      synchronizeBoard();
    }

    synchronizeBoard();
  </script>
</body>
</html>
